server:
  port: 8085

spring:
  application:
    name: appointment-service

  datasource:
    url: jdbc:postgresql://postgres:5432/hms_appointment_db
    username: postgres
    password: 2131

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Consumers parse the JSON themselves, so don't emit cross-service type headers.
        spring.json.add.type.headers: false

hms:
  topics:
    appointment-completed: appointment_completed

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka
